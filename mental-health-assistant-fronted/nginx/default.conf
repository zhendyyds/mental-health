upstream application_backend {
    zone application_backend 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;
    server backend:8082 resolve;
}

server {
    listen 8080;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header token $http_token;
    proxy_set_header Accept-Encoding "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 75s;
    proxy_next_upstream off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /internal {
        return 404;
    }

    location ^~ /internal/ {
        return 404;
    }

    # Only generation and attach stream SSE. Stop and status use ordinary JSON.
    location ~ ^/api/psychological-chat/stream(?:/attach/[0-9]+)?$ {
        proxy_pass http://application_backend;
        proxy_read_timeout 150s;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        add_header X-Accel-Buffering no always;
        add_header Cache-Control no-store always;
    }

    location /api/ {
        proxy_pass http://application_backend;
    }

    location /upload/ {
        proxy_pass http://application_backend;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control no-cache;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
