spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: "${DB_URL}"
    username: "${DB_USERNAME}"
    password: "${DB_PASSWORD}"
    hikari:
      connection-timeout: 3000
      validation-timeout: 1000
  ai:
    openai:
      api-key: "${AI_API_KEY}"
      base-url: "${AI_BASE_URL:https://api.openai.com}"
      chat:
        completions-path: "${AI_COMPLETIONS_PATH:/v1/chat/completions}"
        options:
          model: "${AI_CHAT_MODEL}"
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  address: "${SERVER_ADDRESS:0.0.0.0}"
  port: "${SERVER_PORT:8082}"
  forward-headers-strategy: native
  shutdown: graceful

file:
  upload-dir: "${FILE_UPLOAD_DIR:${UPLOAD_DIR:/app/upload}}"

jwt:
  secret: "${JWT_SECRET}"

app:
  rag:
    enabled: "${RAG_ENABLED:false}"
    version: "${RAG_VERSION:}"
    collection-name: "${RAG_COLLECTION:}"
    embedding-provider: "${RAG_EMBEDDING_PROVIDER:dashscope}"
    embedding-base-url: "${RAG_EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}"
    embedding-path: "${RAG_EMBEDDING_PATH:/embeddings}"
    embedding-api-key: "${RAG_EMBEDDING_API_KEY:}"
    embedding-model: "${RAG_EMBEDDING_MODEL:text-embedding-v4}"
    dimension: "${RAG_EMBEDDING_DIMENSION:1024}"
    qdrant-host: "${RAG_QDRANT_HOST:qdrant}"
    qdrant-port: "${RAG_QDRANT_PORT:6334}"
    qdrant-tls: "${RAG_QDRANT_TLS:false}"
    qdrant-api-key: "${RAG_QDRANT_API_KEY:}"
